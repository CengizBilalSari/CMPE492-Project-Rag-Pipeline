# Microsoft GraphRAG Pipeline Configuration

chunking:
  strategy: "recursive"  # Options: sentence, token, character, recursive, semantic, propositional
  chunk_size: 1000
  chunk_overlap: 200

llm:
  provider: "vertex"       # Options: groq, openai, vertex
  model: "gemini-2.5-flash"
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: "openai"  # Local sentence-transformers (free, no API key)
  model: "all-MiniLM-L6-v2"

neo4j:
  database: "neo4j"
  # URI, user, password loaded from .env

extraction:
  max_concurrency: 2    # Keep low for Groq free tier

entity_resolution:
  enabled: true
  k_neighbors: 10
  similarity_threshold: 0.85
  word_distance_threshold: 3
  max_concurrency: 2

community_detection:
  algorithm: "louvain"   # Options: louvain, leiden (requires Neo4j GDS)
  resolution: 1.0
