chunking:
  strategy: "recursive"  # Options: sentence, token, character, recursive, semantic, propositional
  chunk_size: 2000
  chunk_overlap: 200
llm:
  provider: "vllm"       # Options: groq, openai, vertex, vllm
  model: "Qwen/Qwen2.5-7B-Instruct"
  temperature: 0.0
  max_tokens: 2048 

embedding:
  model: all-MiniLM-L6-v2
neo4j:
  database: neo4j
extraction:
  max_concurrency: 16  # vLLM benefits from high concurrency (continuous batching)

entity_resolution:
  enabled: true
  k_neighbors: 10
  similarity_threshold: 0.85
  word_distance_threshold: 3
  max_concurrency: 1
  use_llm: false
community_detection:
  algorithm: louvain
  resolution: 1.0

global_search:
  max_token_per_batch: 8000
  max_concurrency: 1
  top_k: 20
  top_communities: 30

local_search:
  top_k_entities: 5
  hop_depth: 1
  max_chunks: 10

lazy_search:
  max_subqueries: 5
  max_chunks: 10
  nlp_model: "en_core_web_lg"

