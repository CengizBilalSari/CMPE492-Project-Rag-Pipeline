# Microsoft GraphRAG Pipeline Configuration

chunking:
  strategy: "recursive"  # Options: sentence, token, character, recursive, semantic, propositional
  chunk_size: 1000
  chunk_overlap: 200

llm:
  provider: "vllm"       # Options: groq, openai, vertex
  model: "meta-llama/Llama-3.1-8B-Instruct"
  temperature: 0.0
  max_tokens: 4096 

embedding:
  model: "all-MiniLM-L6-v2"

neo4j:
  database: "neo4j"
  # URI, user, password loaded from .env

extraction:
  max_concurrency: 1  # Keep low for 429 error

entity_resolution:
  enabled: true
  k_neighbors: 10
  similarity_threshold: 0.85
  word_distance_threshold: 3
  max_concurrency: 1
  use_llm: false

community_detection:
  algorithm: "louvain"   # Options: louvain, leiden (requires Neo4j GDS)
  resolution: 1.0

local_search:
  top_k_entities: 5
  hop_depth: 1
  max_chunks: 10

lazy_search:
  max_subqueries: 5
  max_chunks: 10
  nlp_model: "en_core_web_lg"

lazy_search:
  max_subqueries: 5
  max_chunks: 10
  nlp_model: "en_core_web_lg"
