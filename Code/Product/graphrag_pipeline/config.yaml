chunking:
  strategy: recursive
  chunk_size: 1000
  chunk_overlap: 200
llm:
  provider: vllm
  model: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
  temperature: 0.0
  max_tokens: 32768
embedding:
  model: all-MiniLM-L6-v2
neo4j:
  database: neo4j
extraction:
  max_concurrency: 4
entity_resolution:
  enabled: true
  k_neighbors: 10
  similarity_threshold: 0.85
  word_distance_threshold: 3
  max_concurrency: 1
  use_llm: false
community_detection:
  algorithm: louvain
  resolution: 1.0
local_search:
  top_k_entities: 5
  hop_depth: 1
  max_chunks: 10
