services:
  neo4j:
    image: neo4j:5.26.0
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/12345678
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  pipeliner:
    build: ./pipeliner
    container_name: graphrag-pipeliner
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "12345678"
    depends_on:
      neo4j:
        condition: service_healthy

  evaluator:
    build: ./evaluator
    container_name: graphrag-evaluator
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "12345678"
    depends_on:
      neo4j:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    container_name: graphrag-dashboard
    ports:
      - "3000:80"
    depends_on:
      - pipeliner
      - evaluator

volumes:
  neo4j_data:
  neo4j_logs:
