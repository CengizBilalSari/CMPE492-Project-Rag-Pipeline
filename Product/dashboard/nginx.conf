server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to pipeliner
    location /api/ {
        proxy_pass http://pipeliner:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy WebSocket to pipeliner
    location /ws/ {
        proxy_pass http://pipeliner:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Prevent Nginx from killing the WebSocket during long background tasks (e.g., 1 hour timeout)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy evaluation requests to evaluator
    location /eval/ {
        rewrite ^/eval/(.*)$ /api/$1 break;
        proxy_pass http://evaluator:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
